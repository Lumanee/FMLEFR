# Builds the Windows installer, the portable zip and the macOS app.
# - A version tag (v0.1.0) builds the three files, the macOS app's update and latest.json, and opens a draft GitHub
#   release with them once CI (ci.yml) has passed for the tagged commit; a maintainer reviews the draft and publishes
#   it. Once it is published, installed Windows copies and macOS apps find it through latest.json and update
#   themselves.
# - A pull request that changes how releases are built, or a run started by hand, builds the same files and keeps
#   them as workflow artifacts only. A pull request that only changes the version number in tauri.conf.json (a
#   release's own pull request) builds nothing: the tag builds the same files minutes later, into a draft.
# The checks (formatting, clippy, tests and the interface's build) are ci.yml's, on every pull request and every push
# to main; they are not run again here.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "app/src-tauri/tauri.conf.json"
      - "app/src-tauri/tauri.bridge.conf.json"
      - "docs/portable-readme.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # What the run builds, decided in seconds, before any build starts.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On a pull request: its merge commit, and the commit it is merged into.
          fetch-depth: 2

      - name: Check that the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the app's version $version (app/src-tauri/tauri.conf.json)."
            exit 1
          fi

      # A pull request builds the files only if it changes how they are built. A new version number does not, so
      # tauri.conf.json is compared without it.
      - name: Decide whether to build
        id: decide
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            build=false
            if ! git diff --quiet HEAD^1 HEAD -- .github/workflows/release.yml app/src-tauri/tauri.bridge.conf.json \
              docs/portable-readme.txt; then
              build=true
            fi
            conf=app/src-tauri/tauri.conf.json
            if [ "$(git show "HEAD^1:$conf" | jq -S 'del(.version)')" != "$(git show "HEAD:$conf" | jq -S 'del(.version)')" ]; then
              build=true
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Build the files: $build"

  windows:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # No Rust cache: CI's holds what its checks build, which a release build cannot use.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install the interface's packages
        working-directory: app
        run: npm ci

      # `tauri build` builds the interface first (beforeBuildCommand), which the app embeds. The installer is signed
      # with the key whose public half is in tauri.conf.json, so that installed copies accept it as an update; the
      # signature lands beside it (.sig). The key and its password are the repository's secrets
      # TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD; without them the build stops, except on a
      # pull request from a fork, which gets no secrets: its installer is built without the signature.
      - name: Build the installer
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] && [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > unsigned.conf.json
            npx tauri build --bundles nsis --config unsigned.conf.json
          else
            npx tauri build --bundles nsis
          fi

      - name: Package the installer and the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName out/FMLibreEditor-Setup.exe
          if (Test-Path "$($setup.FullName).sig") {
            Copy-Item "$($setup.FullName).sig" out/FMLibreEditor-Setup.exe.sig
          }
          New-Item -ItemType Directory -Force portable/FMLibreEditor | Out-Null
          Copy-Item target/release/FMLibreEditor.exe portable/FMLibreEditor/
          Copy-Item docs/portable-readme.txt portable/FMLibreEditor/README.txt
          Compress-Archive -Path portable/FMLibreEditor -DestinationPath out/FMLibreEditor-portable.zip
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: FMLibreEditor-windows
          path: out/*

  # The macOS app is universal: Apple silicon and Intel Macs run the same one. Its two halves are built side by side,
  # on two machines, as `tauri build --target universal-apple-darwin` builds them one after the other; the macos job
  # joins them and bundles the app.
  macos-build:
    name: macos-build (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Both architectures, for the bridge and its launcher, which are universal so that Intel builds of the game load
      # the bridge too. No Rust cache, as on Windows.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install the interface's packages
        working-directory: app
        run: npm ci

      # tauri.bridge.conf.json lists the bridge and its launcher among the app's resources, which have to be in place
      # before the app is built, so `npm run bridge` comes first. The macos job signs them.
      - name: Build the app for ${{ matrix.target }}
        working-directory: app
        run: |
          npm run bridge
          npx tauri build --target ${{ matrix.target }} --no-bundle --config src-tauri/tauri.bridge.conf.json

      # In a tar, which keeps the files' permissions; an artifact alone does not.
      - name: Keep the build for the macos job
        run: >
          tar -cf "$RUNNER_TEMP/${{ matrix.target }}.tar" -C target
          ${{ matrix.target }}/release/FMLibreEditor
          universal-apple-darwin/release/libfmlibre_bridge.dylib
          universal-apple-darwin/release/fmlibre-launch

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build-${{ matrix.target }}
          path: ${{ runner.temp }}/${{ matrix.target }}.tar
          retention-days: 1

  macos:
    needs: macos-build
    runs-on: macos-latest
    env:
      # With the maintainer's Apple Developer ID in the repository's secrets, the app is signed and notarized, and
      # opens without a warning:
      # - APPLE_CERTIFICATE: the "Developer ID Application" certificate with its key, a .p12 file, in base64;
      # - APPLE_CERTIFICATE_PASSWORD: the password the .p12 was exported with;
      # - APPLE_ID, APPLE_APP_PASSWORD and APPLE_TEAM_ID: the Apple ID, an app-specific password made for it at
      #   account.apple.com, and the team ID, for Apple's notary service.
      # Without them the app is signed ad hoc, and macOS asks once before it opens it.
      SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # `tauri bundle` reads the workspace with cargo.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install the interface's packages
        working-directory: app
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-build-*
          path: ${{ runner.temp }}/builds
          merge-multiple: true

      # The universal app binary, joined with lipo as `tauri build --target universal-apple-darwin` joins it.
      - name: Join the two halves
        run: |
          mkdir -p target
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            tar -xf "$RUNNER_TEMP/builds/$target.tar" -C target
          done
          lipo -create -output target/universal-apple-darwin/release/FMLibreEditor \
            target/aarch64-apple-darwin/release/FMLibreEditor target/x86_64-apple-darwin/release/FMLibreEditor
          lipo -info target/universal-apple-darwin/release/FMLibreEditor

      # The certificate goes into a keychain of its own, which only this job uses.
      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "APPLE_CERTIFICATE holds no Developer ID Application identity." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      # FMLibreEditor.app, universal, with the bridge and its launcher among its resources. With the
      # Developer ID, all three are signed with it and the hardened runtime; without it, ad hoc
      # (`npm run release:mac` does the same on a Mac of one's own).
      - name: Bundle the app
        working-directory: app
        run: |
          config=src-tauri/tauri.bridge.conf.json
          if [ "$SIGNED" = true ]; then
            for binary in ../target/universal-apple-darwin/release/libfmlibre_bridge.dylib \
              ../target/universal-apple-darwin/release/fmlibre-launch; do
              codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$binary"
            done
            node -e '
              const fs = require("fs");
              const config = JSON.parse(fs.readFileSync("src-tauri/tauri.bridge.conf.json", "utf8"));
              config.bundle.macOS.signingIdentity = process.env.APPLE_SIGNING_IDENTITY;
              fs.writeFileSync("src-tauri/tauri.signed.conf.json", JSON.stringify(config, null, 2));
            '
            config=src-tauri/tauri.signed.conf.json
          fi
          npx tauri bundle --target universal-apple-darwin --bundles app --config "$config"

      # Apple's notary service scans the signed app (no review by anyone), usually in minutes; its
      # ticket is stapled to the app, so that it opens without a warning even offline.
      - name: Notarize the app
        if: env.SIGNED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/FMLibreEditor.app
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait \
            --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          status=$(node -p "require('$RUNNER_TEMP/notary.json').status")
          if [ "$status" != "Accepted" ]; then
            id=$(node -p "require('$RUNNER_TEMP/notary.json').id")
            xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
            exit 1
          fi
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"

      # The zip is for people to download. The .tar.gz is what installed apps update from: the same
      # app (notarized, when it is signed), without macOS's extended attributes, signed like the
      # Windows installer with the key whose public half is in tauri.conf.json
      # (TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD), the version in the
      # signature. A pull request from a fork gets no secrets, and its .tar.gz stays unsigned.
      - name: Package the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p out
          bundle=target/universal-apple-darwin/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent "$bundle/FMLibreEditor.app" out/FMLibreEditor-macOS.zip
          COPYFILE_DISABLE=1 tar -czf out/FMLibreEditor-macOS.app.tar.gz --no-xattrs --no-mac-metadata --no-acls \
            -C "$bundle" FMLibreEditor.app
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
            (cd app && npx tauri signer sign --app-version "$version" ../out/FMLibreEditor-macOS.app.tar.gz)
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: FMLibreEditor-macos
          path: out/*

  # Once both systems have built their files.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      # The checks are ci.yml's: CI runs on every push to main, so it has usually passed for the tagged commit before
      # the builds are done; this waits for it if it has not. For a tag on a commit CI has not checked, CI can be run
      # by hand on the tag (gh workflow run ci.yml --ref <tag>) before this job is run again.
      - name: Check that CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA" \
              --jq '[.workflow_runs[] | "\(.status)/\(.conclusion)"] | join(" ")')
            case " $runs " in
              *" completed/success "*)
                echo "CI passed for $GITHUB_SHA."
                exit 0
                ;;
              *" queued/"* | *" in_progress/"* | *" waiting/"* | *" pending/"* | *" requested/"*)
                echo "CI is still running for $GITHUB_SHA ($runs)."
                sleep 30
                ;;
              *)
                echo "::error::CI has not passed for $GITHUB_SHA (${runs:-no run}). Run it on the tag (gh workflow run ci.yml --ref $GITHUB_REF_NAME), then run this job again."
                exit 1
                ;;
            esac
          done
          echo "::error::CI did not finish for $GITHUB_SHA within 30 minutes."
          exit 1

      - uses: actions/download-artifact@v4
        with:
          pattern: FMLibreEditor-*
          path: out
          merge-multiple: true

      # What installed copies read to update themselves (the endpoint in tauri.conf.json): the version, and for each
      # system the file to install with its signature. The macOS app is universal: Apple silicon and Intel Macs (or
      # Rosetta) get the same one.
      - name: Write latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const { TAG, REPO } = process.env;
            const file = (name) => ({
              signature: fs.readFileSync(`out/${name}.sig`, "utf8").trim(),
              url: `https://github.com/${REPO}/releases/download/${TAG}/${name}`,
            });
            const windows = file("FMLibreEditor-Setup.exe");
            const mac = file("FMLibreEditor-macOS.app.tar.gz");
            const latest = {
              version: TAG.replace(/^v/, ""),
              notes: `https://github.com/${REPO}/releases/tag/${TAG}`,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64-nsis": windows,
                "windows-x86_64": windows,
                "darwin-aarch64-app": mac,
                "darwin-aarch64": mac,
                "darwin-x86_64-app": mac,
                "darwin-x86_64": mac,
              },
            };
            fs.writeFileSync("out/latest.json", JSON.stringify(latest, null, 2) + "\n");
          '
          cat out/latest.json

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          out/FMLibreEditor-Setup.exe out/FMLibreEditor-portable.zip out/FMLibreEditor-macOS.zip
          out/FMLibreEditor-macOS.app.tar.gz out/latest.json
          --draft --title "FMLibreEditor ${{ github.ref_name }}"
          --notes-file docs/release-notes.md
