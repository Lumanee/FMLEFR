# Personal build of this fork: the portable Windows app, with no installer and no signing key needed.
# Every push to main builds it and updates the "latest" release with the zip, whose download link never changes:
#   https://github.com/Lumanee/FMLEFR/releases/latest/download/FMLEFR-portable.zip
# It can also be run by hand (Actions tab > Personal build > Run workflow).
name: Personal build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install the interface's packages
        working-directory: app
        run: npm ci

      - name: Build the interface
        working-directory: app
        run: npm run build

      - name: Build the app
        working-directory: app
        run: npx tauri build --no-bundle

      - name: Package the portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/FMLEFR | Out-Null
          Copy-Item target/release/FMLibreEditor.exe portable/FMLEFR/
          Copy-Item docs/portable-readme.txt portable/FMLEFR/README.txt
          Compress-Archive -Path portable/FMLEFR -DestinationPath FMLEFR-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FMLEFR-portable
          path: FMLEFR-portable.zip

      - name: Update the latest release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Build of $env:GITHUB_SHA"
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload latest FMLEFR-portable.zip --clobber
            gh release edit latest --notes $notes
          } else {
            gh release create latest FMLEFR-portable.zip --title "FMLEFR (latest build)" --notes $notes --target $env:GITHUB_SHA
          }
