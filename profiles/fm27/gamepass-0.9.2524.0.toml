# FM27 on Game Pass / Microsoft Store, 0.9.2524.0, the update of 17 November 2026, worked out by
# `fmlibre-probe profile` on a save of 18 January 2028, where all 12 checks passed. The statics moved: the players pair
# sits 0x430A8 after that of 0.9.2435.0, and the statics around the retirement manager no longer sit at the old
# distances from it (the manager's is 0xD2E8 before the players pair, 0xED70 in 0.9.2435.0), so the guesses from the
# builds before held neither the manager nor the game's own object, and the search found both. The object layout is
# the same but for the club finance record, which keeps corporate facilities 4 bytes further on (see the end).
name = "FM27 0.9.2524.0 (Game Pass)"
edition = 27
storefront = "gamePass"
package_version = "0.9.2524.0"

# The in-game date, 2028-01-18 on the save: 3764 of 3764 contract dates before it, and 181 of 181 current injuries
# begun by then and not over. Another value, at 0x53BB3B4, held the day after (2028-01-19), which 166 of the 181
# injuries fit.
current_date = 0x539DD10

# The static pointer to the retirement manager (RETIREMENT_MANAGER),
# 0xD2E8 before the players pair; 437 planned retirements on the save.
retirement_manager = 0x53EDBA0

# The static pointer to the game's one GAME_UI object, whose count of saves loaded tells a load from a save (1 loaded
# on the save): 0xBB8 after the players pair, as on Steam build 26620374, so each build's profile guesses the other's.
# Another static, at 0x53E99C0 (0x41E0 before the retirement manager's), points at it too, and the search finds that
# one first. Neither sits 0x3C80 before the players pair, as the one the builds before name did.
game_ui = 0x53FBA40

# The static pointers to the tactics the human managers keep for their teams (TACTICS_MANAGER, 0xD0 after the
# retirement manager's, as in 0.9.2435.0) and to the training manager (TRAINING_MANAGER), which keeps the history of
# training of their players: each the one pointer in the plugin to the one object of its class.
tactics_manager = 0x53EDC70
training_manager = 0x53EA210

# game_plugin as mapped in memory; these values identify the build.
[plugin]
size_of_image = 0x179AD000
link_timestamp = 0x6AF5C8C6

# RVAs in game_plugin of the (begin, end) pointer pairs of the entity arrays.
[arrays]
players = 0x53FAE88
staff = 0x53FAED0
clubs = 0x53FB040

# RVAs of the pairs of the arrays of national teams' containers (docs/recon/fm27-national-teams.md): 251 for the men's
# teams and 251 for the women's, 0xA8 and 0xC0 past the players pair as in 0.9.2435.0.
[national_teams]
men = 0x53FAF30
women = 0x53FAF48

# The club finance record (layout.toml, [club_finance]) keeps corporate facilities at 0x8AD, 4 bytes further on than
# the builds before: 30 of 30 clubs of the save read there what 0.9.2435.0 read at 0x8A9 (Beşiktaş 20, Fenerbahçe 12,
# Trabzonspor 16), and 0x8A9 held 0 for each. The balance, the budgets and the ticket price are where they were. Read
# at 0x8A9, no club's finances look real and the editor reads none.
[club_finance]
corporate = 0x8AD
