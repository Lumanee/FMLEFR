# FM27 27.0.0 on Steam (app 4530370, build 26340721), the update of November 2026. Its game_plugin.dll was linked
# 526 seconds after the one of Game Pass 0.9.2409.0, and moved alike: the arrays and the retirement manager's static
# 0x2000 further than in build 26227640, the in-game date to a variable of its own. The object layout is unchanged.
name = "FM27 Steam build 26340721 (27.0.0)"
edition = 27
storefront = "steam"

# The in-game date: 2 November 2026 on the Steam test save, as the game's own "2nd November 2026" says. The date with
# the arrays (ClusterLayout::current_date) reads 1 January 1900, unset, as on Game Pass.
current_date = 0x56AF378

# The static pointer to the retirement manager (RETIREMENT_MANAGER): the only pointer to the one object of that
# class, 0xDAC0 before the players pair as in build 26227640.
retirement_manager = 0x56F7D10

# The static pointer to the game's one GAME_UI object, whose count of saves loaded tells a load from a save (issue
# #122): 0x3C80 before the players pair, as on Game Pass 0.9.2409.0.
game_ui = 0x5701B50

# The prize money competitions pay (layout.toml, [prize_money]; #123) was read on this build on a save of 2028/29 and
# matched to the game's screens: the Champions League league phase pays £1.8M per win and £601K per draw there.
prize_money = true

# A club's sponsorship deals (layout.toml, [sponsorship]; #114) were read on this build and matched to the entries of
# VfB Stuttgart's Sponsorship screen, by amount and date, in the reports of the issue; not read by this editor on it yet.
sponsorships = true

# game_plugin.dll as mapped in memory; these two values identify the build.
[plugin]
size_of_image = 0x1821C000
link_timestamp = 0x6AE565AF

# RVAs in game_plugin.dll of the (begin, end) pointer pairs of the entity arrays.
[arrays]
players = 0x57057D0
staff = 0x5705818
clubs = 0x5705988

# [national_teams] is not here: the places of the national teams were not read on this build, so the National teams
# tab shows nothing on it (see docs/DEVELOPING.md, National teams).
