# FM27 on Steam, build 26620374: the update of 17 November 2026, worked out by `fmlibre-probe profile` on a save of
# 14 October 2026, where all 12 checks passed. As on Game Pass 0.9.2524.0, the same update, the statics moved (the
# retirement manager's is 0xC068 before the players pair, 0xDAC0 in build 26577676, so the search found it) and the
# club finance record keeps corporate facilities 4 bytes further on (see the end); the rest of the object layout is
# the same.
name = "FM27 Steam build 26620374"
edition = 27
storefront = "steam"

# The in-game date, 2026-10-14 on the save: 3622 of 3622 contract dates before it, and 120 of 120 current injuries
# begun by then and not over. The field beside the arrays held it too.
current_date = 0x58268E0

# The static pointer to the retirement manager (RETIREMENT_MANAGER),
# 0xC068 before the players pair; 14 planned retirements on the save.
retirement_manager = 0x586F850

# The static pointer to the game's one GAME_UI object, whose count of saves loaded tells a load from a save (1 loaded
# on the save): 0xBB8 after the players pair, as on Game Pass 0.9.2524.0. Another static, at 0x586B680, points at it
# too.
game_ui = 0x587C470

# The static pointers to the tactics the human managers keep for their teams (TACTICS_MANAGER, 0xD0 after the
# retirement manager's, as before) and to the training manager (TRAINING_MANAGER), which keeps the history of training
# of their players: each the one pointer in the plugin to the one object of its class.
tactics_manager = 0x586F920
training_manager = 0x586BED0

# The prize money competitions pay (layout.toml, [prize_money]; #123) was read on this build on a save of 14 October
# 2026: 309 settings, all held by a stage. The Premier League pays its 20 places from £53,100,000 to £2,600,000, Serie
# A from £28,691,666 to £773,129, and the Champions League's league phase 36 places from £10,222,480, £1,803,967 per
# win and £601,323 per draw: to the pound what build 26577676 read on the same save.
prize_money = true

# game_plugin as mapped in memory; these values identify the build.
[plugin]
size_of_image = 0x18878000
link_timestamp = 0x6AF5C68F

# RVAs in game_plugin of the (begin, end) pointer pairs of the entity arrays.
[arrays]
players = 0x587B8B8
staff = 0x587B900
clubs = 0x587BA70

# RVAs of the pairs of the arrays of national teams' containers (docs/recon/fm27-national-teams.md): 251 for the men's
# teams and 251 for the women's, 0xA8 and 0xC0 past the players pair as in build 26577676.
[national_teams]
men = 0x587B960
women = 0x587B978

# The club finance record (layout.toml, [club_finance]) keeps corporate facilities at 0x8AD, 4 bytes further on than
# the builds before, as on Game Pass 0.9.2524.0: 30 of 30 clubs read there what build 26385295 read at 0x8A9 (Arsenal
# 19, Liverpool 16, Galatasaray 20), and 0x8A9 held 0 for each. The balance, the budgets and the ticket price are where
# they were.
[club_finance]
corporate = 0x8AD
