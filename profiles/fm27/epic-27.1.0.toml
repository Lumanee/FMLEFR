# FM27 (Epic Games Store), worked out by fmlibre-probe 0.5.3 on a save
# of 2028-10-09: all 12 checks passed.
#
# The same code as Steam build 26620374, the update of 17 November 2026 (27.1.0), linked about four minutes after it:
# every place the probe found here is where that build keeps it. So this profile keeps all that Steam build 26620374's
# keeps, the places and layout nobody has read on Epic among them (each says so below), and a unit test in profile.rs
# keeps the two alike.
name = "FM27 (Epic Games Store)"
edition = 27
storefront = "epic"

# The in-game date, 2028-10-09 on the save: 3862 of 3862 contract dates
# before it, and 98 of 98 current injuries begun by then and not over.
current_date = 0x58268E0

# The static pointer to the retirement manager (RETIREMENT_MANAGER),
# 0xC068 before the players pair; 2808 planned retirements on the save.
retirement_manager = 0x586F850

# The static pointer to the game's own object (game_plugin::GAME_UI), whose count of saves loaded
# tells a load from a save: 0xBB8 after the players pair; 2 loaded when it was found.
game_ui = 0x587C470

# The static pointers to the tactics the human managers keep for their teams (TACTICS_MANAGER) and to the training
# manager (TRAINING_MANAGER), where Steam build 26620374 keeps them, between the places above; not read on this build.
# Max tactics writes only once the players' records of familiarity and the training histories check out.
tactics_manager = 0x586F920
training_manager = 0x586BED0

# The prize money competitions pay (layout.toml, [prize_money]; #123) was read on this build on a save of 2028/29 and
# matched to the game's screens: the Champions League league phase pays £1.8M per win and £601K per draw there.
prize_money = true

# game_plugin as mapped in memory; these values identify the build.
[plugin]
size_of_image = 0x18095000
link_timestamp = 0x6AF5C793

# RVAs in game_plugin of the (begin, end) pointer pairs of the entity arrays.
[arrays]
players = 0x587B8B8
staff = 0x587B900
clubs = 0x587BA70

# RVAs of the pairs of the arrays of national teams' containers, 0xA8 and 0xC0 past the players pair, between the staff
# and the clubs pairs, as on Steam build 26620374; not read on this build. The National teams tab shows them only when
# their containers read as the game's national teams.
[national_teams]
men = 0x587B960
women = 0x587B978

# What this build lays out otherwise than layout.toml, as Steam build 26620374 and Game Pass 0.9.2524.0 (the same
# update) do; not read on this build. The club finance record keeps corporate facilities at 0x8AD, 4 bytes further on,
# and the editor reads a club's finances only where they look real. A team's tactics keep the list of tactics and the
# index of the one in use 8 bytes further on.
[layout.club_finance]
corporate = 0x8AD

[layout.tactics]
tactics = 0x1018
current = 0x1030
